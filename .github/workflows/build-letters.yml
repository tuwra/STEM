name: Build sign letters
on:
  push:
    branches: [main]
    paths: ['tools/build_letters.py', '.github/workflows/build-letters.yml']
permissions:
  contents: write
concurrency:
  group: build-letters
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: train-data, path: train }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install mediapipe==0.10.14 pillow
      - run: python -u tools/build_letters.py train ishara/signs-base.json | tee build-report.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          cp build-report.txt tools/build-report.txt
          git add ishara/signs-base.json tools/build-report.txt
          git commit -m "بناء الحروف من مجموعة البيانات [skip ci]" || echo "nothing to commit"
          git push
